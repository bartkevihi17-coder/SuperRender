name: Build Windows bundle

on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "third_party/SuperRenderFrameGen.exe"
      - "third_party/SuperRenderFrameGen-SHA256.txt"

permissions:
  contents: write

concurrency:
  group: superrender-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout SuperRender
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build external Frame Generation helper
        shell: powershell
        run: |
          msbuild native\framegen\SuperRenderFrameGen.vcxproj /m /p:Configuration=Release /p:Platform=x64
          $helper = "native\framegen\x64\Release\SuperRenderFrameGen.exe"
          if (!(Test-Path $helper)) { throw "SuperRenderFrameGen.exe was not produced" }
          Copy-Item $helper third_party\SuperRenderFrameGen.exe -Force
          $hash = (Get-FileHash third_party\SuperRenderFrameGen.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content third_party\SuperRenderFrameGen-SHA256.txt $hash
          Write-Host "SuperRenderFrameGen SHA256: $hash"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.9,<8"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build SuperRender.exe
        run: python scripts/build_low_priority.py

      - name: Commit reproducible Windows binaries
        shell: powershell
        run: |
          git config user.name "SuperRender Build"
          git config user.email "actions@users.noreply.github.com"
          git add dist/SuperRender.exe third_party/SuperRenderFrameGen.exe third_party/SuperRenderFrameGen-SHA256.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: refresh Windows bundle for external FrameGen [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "No binary changes to commit."
          }
